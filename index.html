<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ほしあつめ — Star Catcher</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090e23;color:#f3f2ff;font-family:system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px}main{width:min(100%,520px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:24px;margin:0}small{color:#abb4d5}#stats{display:flex;gap:20px;background:#171f3d;padding:16px 20px;border-radius:16px;margin:18px 0}#stats span{flex:1;font-size:14px;color:#abb4d5}b{display:block;color:#fff;font-size:25px;margin-top:3px}.field{position:relative}canvas{width:100%;display:block;background:linear-gradient(#151c40,#242049);border:1px solid #424a73;border-radius:22px;touch-action:none}#overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:30px;border-radius:22px;background:#090e23c9}#overlay h2{font-size:30px;margin:0 0 12px}#overlay p{color:#c2c9e4;line-height:1.8}button{background:#b2f5d1;border:0;border-radius:12px;padding:15px 24px;color:#15362b;font:700 16px system-ui;cursor:pointer}button:hover{background:#d1ffe6}button:focus-visible{outline:3px solid #fff;outline-offset:4px}footer{text-align:center;font-size:13px;color:#abb4d5;margin-top:18px;line-height:1.8}.tag{color:#b2f5d1;font-size:12px;letter-spacing:2px}
</style>
<main><header><div><div class="tag">A LITTLE SPACE BREAK</div><h1>✦ ほしあつめ</h1></div><small>STAR CATCHER</small></header><div id="stats"><span>スコア<b id="score">0</b></span><span>のこり<b id="time">45</b></span><span>ベスト<b id="best">0</b></span></div><div class="field"><canvas width="480" height="540" aria-label="星を集めるゲーム。左右キーまたは画面のドラッグで操作"></canvas><div id="overlay"><h2 id="title">星空を、ひとすくい。</h2><p id="message">黄色い星をキャッチして得点！<br>赤い隕石には気をつけて。<br>45秒で何個集められる？</p><button id="start">あそぶ →</button></div></div><footer>← → / A・D で移動 · スマホは画面をドラッグ<br>✦ 星 +10点　☄ 隕石 −20点</footer></main>
<script>
'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),bestEl=document.querySelector('#best'),overlay=document.querySelector('#overlay');
let best=0;try{best=Number(localStorage.getItem('starcatcher-best'))||0}catch{}bestEl.textContent=best;
let score=0,remaining=45,playing=false,x=240,items=[],sparks=[],spawn=0,last=0,elapsed=0;
const keys=new Set();
const background=Array.from({length:65},()=>({x:Math.random()*480,y:Math.random()*540,r:Math.random()*1.6+.4}));
function star(px,py,r,color){ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;ctx.lineTo(px+Math.cos(a)*rr,py+Math.sin(a)*rr)}ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function draw(){ctx.clearRect(0,0,480,540);for(const s of background){ctx.globalAlpha=.35+.25*Math.sin(elapsed+s.x);ctx.fillStyle='#dee6ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const o of items){if(o.bad){ctx.fillStyle='#ff8599';ctx.beginPath();ctx.arc(o.x,o.y,13,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ff859955';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(o.x+13,o.y-29);ctx.stroke()}else star(o.x,o.y,15,'#ffe495')}for(const s of sparks){ctx.globalAlpha=Math.max(0,s.life/.5);ctx.fillStyle=s.color;ctx.fillRect(s.x,s.y,4,4)}ctx.globalAlpha=1;ctx.shadowBlur=24;ctx.shadowColor='#a7f5d2';ctx.fillStyle='#a7f5d2';ctx.beginPath();ctx.roundRect(x-30,479,60,18,8);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#d9ffed';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-28,478);ctx.lineTo(x-35,465);ctx.moveTo(x+28,478);ctx.lineTo(x+35,465);ctx.stroke()}
function finish(){playing=false;keys.clear();if(score>best){best=score;try{localStorage.setItem('starcatcher-best',String(best))}catch{}}bestEl.textContent=best;document.querySelector('#title').textContent='星あつめ、おつかれさま！';document.querySelector('#message').textContent=`今回のスコアは ${score} 点。ベストは ${best} 点！`;document.querySelector('#start').textContent='もう一度あそぶ →';overlay.style.display='grid'}
function frame(now){const dt=Math.min((now-last)/1000||0,.05);last=now;if(playing){elapsed+=dt;remaining=Math.max(0,45-elapsed);timeEl.textContent=Math.ceil(remaining);x+=((keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0))*360*dt;x=Math.max(35,Math.min(445,x));spawn-=dt;if(spawn<=0){items.push({x:20+Math.random()*440,y:-25,bad:Math.random()<.24,speed:145+Math.random()*85+elapsed*2});spawn=.38}for(const o of items){o.y+=o.speed*dt;if(o.y>=465&&o.y<=505&&Math.abs(o.x-x)<42){score=Math.max(0,score+(o.bad?-20:10));scoreEl.textContent=score;o.y=600;for(let i=0;i<12;i++)sparks.push({x:o.x,y:479,vx:(Math.random()-.5)*180,vy:-Math.random()*150,life:.5,color:o.bad?'#ff8599':'#ffe495'})}}items=items.filter(o=>o.y<570);for(const s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt}sparks=sparks.filter(s=>s.life>0);if(remaining<=0)finish()}draw();requestAnimationFrame(frame)}
document.querySelector('#start').onclick=()=>{score=0;elapsed=0;remaining=45;x=240;items=[];sparks=[];spawn=0;keys.clear();scoreEl.textContent=0;timeEl.textContent=45;overlay.style.display='none';playing=true;last=performance.now()};
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key)){if(playing)e.preventDefault();keys.add(e.key)}});window.addEventListener('keyup',e=>keys.delete(e.key));window.addEventListener('blur',()=>keys.clear());
function move(e){if(!playing)return;const r=canvas.getBoundingClientRect();x=Math.max(35,Math.min(445,(e.clientX-r.left)*480/r.width))}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);move(e)});canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e)});
requestAnimationFrame(frame);
</script></html>
